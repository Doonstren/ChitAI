<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — каталог</title>
    <link rel="stylesheet" href="/css/main.css?v=7">
</head>
<body>
    <nav class="site-nav">
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/about">Про нас</a>
        <a href="/help">Допомога</a>
        <a href="/contacts">Контакти</a>
        <a href="/chat">Нейробібліотекар</a>
        <a class="profile-link" href="/profile">Профіль</a>
    </nav>

    <nav class="breadcrumbs" aria-label="Хлібні крихти">
        <a href="/">Головна</a>
        <span>/</span>
        <span>Каталог</span>
    </nav>

    <h1>Каталог</h1>

    <section id="auth-section" class="auth-section" style="visibility: hidden; min-height: 40px;">
        <div class="auth-controls">
            <input type="text" id="nickname" placeholder="Нікнейм (для реєстрації)" style="display:none;">
            <input type="email" id="email" placeholder="Email" style="display:none;">
            <input type="password" id="password" placeholder="Пароль" style="display:none;">
            <button id="btn-login" type="button" style="display:none;">Увійти</button>
            <button id="btn-register" type="button" style="display:none;">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Завантаження...</p>
    </section>

    <main class="catalog-layout">
        <aside class="catalog-filters">
            <h2>Фільтри</h2>
            <label>
                Пошук
                <input type="search" id="catalog-search" placeholder="Назва або автор">
            </label>
            <label>
                Жанр
                <select id="genre-filter">
                    <option value="">Усі жанри</option>
                </select>
            </label>
            <label>
                Автор
                <select id="author-filter">
                    <option value="">Усі автори</option>
                </select>
            </label>
            <button id="reset-filters" type="button" class="secondary-button">Скинути</button>
        </aside>

        <section>
            <p id="catalog-status">Завантаження каталогу...</p>
            <div id="catalog-books" class="catalog-books"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>ЧитAI — курсова робота студентів групи ММТЕ-11.</p>
    </footer>

    <script type="module" src="/js/firebase-config.js?v=7"></script>
    <script type="module" src="/js/catalog.js?v=7"></script>
</body>
</html>
