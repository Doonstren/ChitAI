<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — каталог</title>
    <link rel="icon" type="image/svg+xml" href="/assets/Favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css?v=2">
    <link rel="stylesheet" href="/css/kit.css?v=17">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
</head>
<body class="catalog-body">
    <div class="app">
        <header class="hdr">
            <div class="hdr-in">
                <a class="logo" href="/">ЧитAI</a>
                <nav class="nav" aria-label="Головна навігація">
                    <a href="/">Головна</a>
                    <a class="active" href="/catalog">Каталог</a>
                    <a href="/about">Про нас</a>
                    <a href="/help">Допомога</a>
                    <a href="/contacts">Контакти</a>
                </nav>
                <div class="hdr-sp"></div>
                <a class="btn btn-primary hdr-ai" href="/chat">ЧитAI</a>
                <form class="hdr-search" id="hdr-search">
                    <input id="hdr-search-input" placeholder="Пошук…" aria-label="Пошук книг">
                    <button type="submit">Знайти</button>
                </form>
                <a class="btn btn-teal hdr-login auth-link-pending" href="/profile">Вхід</a>
                <a class="btn btn-teal hdr-register auth-link-pending" href="/profile">Реєстрація</a>
                <button class="btn btn-teal theme-toggle" type="button" title="Темна тема — скоро" aria-label="Перемкнути тему">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>
        <script>
            (() => {
                try {
                    const login = document.querySelector(".hdr-login");
                    const register = document.querySelector(".hdr-register");
                    if (!login || !register) return;
                    if (localStorage.getItem("isLoggedIn") === "true") {
                        login.textContent = "Профіль";
                        register.style.display = "none";
                    } else {
                        login.textContent = "Вхід";
                        register.textContent = "Реєстрація";
                        register.style.display = "";
                    }
                    login.classList.remove("auth-link-pending");
                    register.classList.remove("auth-link-pending");
                } catch (error) {
                    document.querySelector(".hdr-login")?.classList.remove("auth-link-pending");
                    document.querySelector(".hdr-register")?.classList.remove("auth-link-pending");
                }
            })();
        </script>

        <main class="page catalog-page">
            <nav class="crumbs" aria-label="Хлібні крихти">
                <a href="/">Головна</a>
                <span>»</span>
                <b>Каталог</b>
            </nav>

            <div class="catalog-toolbar">
                <div>
                    <h1 class="catalog-title serif">Каталог книг</h1>
                    <p id="catalog-status" class="catalog-status">Завантаження каталогу…</p>
                </div>
                <div class="sort-row" aria-label="Сортування">
                    <button class="sort-btn active" type="button" data-sort="popularity">За Популярністю</button>
                    <button class="sort-btn" type="button" data-sort="year-desc">За роком (новіші)</button>
                    <button class="sort-btn" type="button" data-sort="year-asc">За роком (старіші)</button>
                    <button class="sort-btn" type="button" data-sort="title-asc">За назвою А-Я</button>
                    <button class="sort-btn" type="button" data-sort="title-desc">За назвою Я-А</button>
                </div>
            </div>

            <div class="catalog-shell">
                <aside class="catalog-filters" aria-label="Фільтри каталогу">
                    <h2 class="catalog-filter-title serif">Фільтри</h2>

                    <div class="label">Жанри</div>
                    <div id="genre-filter" class="filter-checks"></div>

                    <label class="label" for="catalog-search">Автор</label>
                    <input class="field" type="search" id="catalog-search" placeholder="Пошук...">
                    <button id="find-filters" type="button" class="btn btn-primary btn-block">Знайти</button>

                    <div class="label">Рік видання</div>
                    <div class="range2" id="year-range">
                        <div class="track"></div>
                        <div class="fill" id="year-range-fill"></div>
                        <input id="year-min-filter" type="range" min="0" max="0" value="0" aria-label="Мінімальний рік">
                        <input id="year-max-filter" type="range" min="0" max="0" value="0" aria-label="Максимальний рік">
                    </div>
                    <div class="range-vals"><span id="year-min-label">—</span><span id="year-max-label">—</span></div>

                    <button id="apply-filters" type="button" class="btn btn-primary btn-block">Застосувати</button>
                    <button id="reset-filters" type="button" class="btn btn-secondary btn-block">Скинути</button>
                </aside>

                <section class="catalog-results" aria-label="Книги">
                    <div id="catalog-books" class="catalog-grid"></div>
                    <nav id="catalog-pagination" class="pager catalog-pager" aria-label="Сторінки каталогу"></nav>
                </section>
            </div>
        </main>

        <button id="back-to-top" class="icon-btn icon-btn-up back-to-top" type="button" aria-label="Вгору"></button>

        <footer class="ftr">
            <div class="ftr-in">
                <p>© 2025 ТОВ "Освітній Простір". Всі права захищено.</p>
                <p><a href="/help">Політика конфіденційності</a> | <a href="/about">Про нас</a> | <a href="/contacts">Контакти</a></p>
            </div>
        </footer>
    </div>

    <script type="module" src="/js/firebase-config.js?v=9"></script>
    <script type="module" src="/js/catalog.js?v=15"></script>
</body>
</html>
