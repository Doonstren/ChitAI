<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — бажане</title>
    <link rel="icon" type="image/svg+xml" href="/assets/Favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css?v=2">
    <link rel="stylesheet" href="/css/kit.css?v=31">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
</head>
<body class="catalog-body">
    <div class="app">
        <header class="hdr">
            <div class="hdr-in">
                <a class="logo" href="/">ЧитAI</a>
                <nav class="nav" aria-label="Головна навігація">
                    <a href="/">Головна</a>
                    <a href="/catalog">Каталог</a>
                    <a href="/about">Про нас</a>
                    <a href="/help">Допомога</a>
                    <a href="/contacts">Контакти</a>
                </nav>
                <div class="hdr-sp"></div>
                <a class="btn btn-primary hdr-ai" href="/chat">ЧитAI</a>
                <form class="hdr-search" id="hdr-search">
                    <input id="hdr-search-input" placeholder="Пошук…" aria-label="Пошук книг">
                    <button type="submit">Знайти</button>
                </form>
                <a class="btn btn-teal hdr-login auth-link-pending" href="/login">Вхід</a>
                <a class="btn btn-teal hdr-register auth-link-pending" href="/login#register">Реєстрація</a>
                <button class="btn btn-teal theme-toggle" type="button" title="Темна тема — скоро" aria-label="Перемкнути тему">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <main class="page catalog-page wishlist-page">
            <nav class="crumbs" aria-label="Хлібні крихти">
                <a href="/">Головна</a>
                <span>»</span>
                <a href="/profile">Профіль</a>
                <span>»</span>
                <b>Бажане</b>
            </nav>

            <div class="catalog-toolbar">
                <div>
                    <h1 class="catalog-title serif">Бажане</h1>
                    <p id="wishlist-status" class="catalog-status">Завантаження бажаного…</p>
                </div>
                <div class="sort-row" aria-label="Сортування">
                    <button class="sort-btn active" type="button" data-sort="popularity">За Популярністю</button>
                    <button class="sort-btn" type="button" data-sort="year-desc">За роком (новіші)</button>
                    <button class="sort-btn" type="button" data-sort="year-asc">За роком (старіші)</button>
                    <button class="sort-btn" type="button" data-sort="title-asc">За назвою А-Я</button>
                    <button class="sort-btn" type="button" data-sort="title-desc">За назвою Я-А</button>
                </div>
            </div>

            <div class="catalog-shell">
                <aside class="catalog-filters" aria-label="Фільтри бажаного">
                    <h2 class="catalog-filter-title serif">Фільтри</h2>

                    <div class="label">Жанри</div>
                    <div id="wishlist-genre-filter" class="filter-checks"></div>

                    <label class="label" for="wishlist-search">Автор</label>
                    <input class="field" type="search" id="wishlist-search" placeholder="Пошук...">
                    <button id="wishlist-find-filters" type="button" class="btn btn-primary btn-block">Знайти</button>

                    <div class="label">Рік видання</div>
                    <div class="range2" id="wishlist-year-range">
                        <div class="track"></div>
                        <div class="fill" id="wishlist-year-range-fill"></div>
                        <input id="wishlist-year-min-filter" type="range" min="0" max="0" value="0" aria-label="Мінімальний рік">
                        <input id="wishlist-year-max-filter" type="range" min="0" max="0" value="0" aria-label="Максимальний рік">
                    </div>
                    <div class="range-vals"><span id="wishlist-year-min-label">—</span><span id="wishlist-year-max-label">—</span></div>

                    <button id="wishlist-apply-filters" type="button" class="btn btn-primary btn-block">Застосувати</button>
                    <button id="wishlist-reset-filters" type="button" class="btn btn-secondary btn-block">Скинути</button>
                </aside>

                <section class="catalog-results wishlist-results" aria-label="Бажані книги">
                    <div id="wishlist-books" class="catalog-grid"></div>
                    <nav id="wishlist-pagination" class="pager catalog-pager" aria-label="Сторінки бажаного"></nav>
                </section>
            </div>
        </main>

        <button id="back-to-top" class="icon-btn icon-btn-up back-to-top" type="button" aria-label="Вгору"></button>

        <footer class="ftr">
            <div class="ftr-in">
                <p>© 2025 ТОВ "Освітній Простір". Всі права захищено.</p>
                <p><a href="/help">Політика конфіденційності</a> | <a href="/about">Про нас</a> | <a href="/contacts">Контакти</a></p>
            </div>
        </footer>
    </div>

    <script type="module" src="/js/firebase-config.js?v=9"></script>
    <script type="module" src="/js/wishlist.js?v=5"></script>
</body>
</html>
