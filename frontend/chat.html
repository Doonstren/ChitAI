<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — нейробібліотекар</title>
    <link rel="icon" type="image/svg+xml" href="/assets/Favicon.svg">
    <link rel="stylesheet" href="/css/main.css?v=11">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <nav class="site-nav">
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/about">Про нас</a>
        <a href="/help">Допомога</a>
        <a href="/contacts">Контакти</a>
        <a href="/chat">Нейробібліотекар</a>
        <a class="profile-link" href="/profile">Профіль</a>
    </nav>

    <nav class="breadcrumbs" aria-label="Хлібні крихти">
        <a href="/">Головна</a>
        <span>/</span>
        <span>Нейробібліотекар</span>
    </nav>

    <h1>Нейробібліотекар</h1>

    <section id="auth-section" class="auth-section" style="visibility: hidden; min-height: 40px;">
        <div class="auth-controls">
            <input type="text" id="nickname" placeholder="Нікнейм (для реєстрації)" style="display:none;">
            <input type="email" id="email" placeholder="Email" style="display:none;">
            <input type="password" id="password" placeholder="Пароль" style="display:none;">
            <button id="btn-login" type="button" style="display:none;">Увійти</button>
            <button id="btn-register" type="button" style="display:none;">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Завантаження...</p>
    </section>

    <p id="chat-auth-note">Увійдіть, щоб писати нейробібліотекарю та зберігати історію розмов.</p>

    <main id="chat-app" class="chat-layout hidden">
        <aside>
            <button id="btn-new-thread" type="button" class="secondary-button">Нова розмова</button>
            <h2>Історія</h2>
            <div id="chat-thread-list" class="chat-thread-list"></div>
        </aside>

        <section>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="auth-controls">
                <input type="text" id="chat-input" placeholder="Запитайте про книги..." style="flex:1;">
                <button id="btn-send" type="button" class="primary-button">Надіслати</button>
            </div>
            <p id="chat-status"></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>ЧитAI — курсова робота студентів групи ММТЕ-11.</p>
    </footer>

    <script type="module" src="/js/firebase-config.js?v=9"></script>
    <script type="module" src="/js/chat.js?v=9"></script>
</body>
</html>
