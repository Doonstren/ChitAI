<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — Чат</title>
    <link rel="icon" type="image/svg+xml" href="/assets/Favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css?v=2">
    <link rel="stylesheet" href="/css/kit.css?v=32">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Light:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <div class="app">
        <header class="hdr">
            <div class="hdr-in">
                <a class="logo" href="/">ЧитAI</a>
                <nav class="nav" aria-label="Головна навігація">
                    <a href="/">Головна</a>
                    <a href="/catalog">Каталог</a>
                    <a href="/about">Про нас</a>
                    <a href="/help">Допомога</a>
                    <a href="/contacts">Контакти</a>
                </nav>
                <div class="hdr-sp"></div>
                <a class="btn btn-primary hdr-ai active" href="/chat">ЧитAI</a>
                <form class="hdr-search" id="hdr-search">
                    <input id="hdr-search-input" placeholder="Пошук…" aria-label="Пошук книг">
                    <button type="submit">Знайти</button>
                </form>
                <a class="btn btn-teal hdr-login auth-link-pending" href="/login">Вхід</a>
                <a class="btn btn-teal hdr-register auth-link-pending" href="/login#register">Реєстрація</a>
                <button class="btn btn-teal theme-toggle" type="button" title="Темна тема — скоро" aria-label="Перемкнути тему">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <main class="page static-page">
            
            <p id="chat-auth-note" class="small text-center" style="margin-top: 48px;">Увійдіть, щоб писати нейробібліотекарю та зберігати історію розмов.</p>

            <h1 id="chat-title" class="chat-page-title serif hidden">ЧитAI</h1>
            <div id="chat-app" class="chat-layout hidden">
                <aside class="chat-sidebar">
                    <h2 class="serif">Чати</h2>
                    <div class="chat-thread-list" id="chat-thread-list"></div>
                    <button id="btn-new-thread" type="button" class="btn btn-primary chat-new-thread">+ Новий чат</button>
                </aside>

                <section class="chat-main">
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Запитайте: “хочу щось легке для відпочинку”">
                        <button id="btn-send" type="button" class="btn btn-primary">Надіслати</button>
                    </div>
                    <p id="chat-status" class="small text-center" style="margin: 0; min-height: 19px;"></p>
                </section>
            </div>

        </main>

        <footer class="ftr">
            <div class="ftr-in">
                <p>© 2025 ТОВ "Освітній Простір". Всі права захищено.</p>
                <p><a href="/help">Політика конфіденційності</a> | <a href="/about">Про нас</a> | <a href="/contacts">Контакти</a></p>
            </div>
        </footer>
    </div>

    <script type="module" src="/js/firebase-config.js?v=9"></script>
    <script type="module" src="/js/chat.js?v=18"></script>
</body>
</html>
