<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — нейробібліотекар</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <a href="/">Каталог</a>
        <a href="/chat">Нейробібліотекар</a>
        <a href="/profile">Профіль</a>
    </nav>

    <h1>Нейробібліотекар</h1>

    <section id="auth-section" class="auth-section">
        <div class="auth-controls">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button id="btn-login" type="button">Увійти</button>
            <button id="btn-register" type="button">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Не авторизовано</p>
    </section>

    <p id="chat-auth-note">Увійдіть, щоб писати нейробібліотекарю та зберігати історію розмов.</p>

    <main id="chat-app" class="chat-layout hidden">
        <aside>
            <button id="btn-new-thread" type="button" class="secondary-button">Нова розмова</button>
            <h2>Історія</h2>
            <div id="chat-thread-list" class="chat-thread-list"></div>
        </aside>

        <section>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="auth-controls">
                <input type="text" id="chat-input" placeholder="Запитайте про книги..." style="flex:1;">
                <button id="btn-send" type="button" class="primary-button">Надіслати</button>
            </div>
            <p id="chat-status"></p>
        </section>
    </main>

    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/chat.js"></script>
</body>
</html>
