<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — профіль</title>
    <link rel="stylesheet" href="/css/main.css?v=8">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <nav class="site-nav">
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/about">Про нас</a>
        <a href="/help">Допомога</a>
        <a href="/contacts">Контакти</a>
        <a href="/chat">Нейробібліотекар</a>
        <a class="profile-link" href="/profile">Профіль</a>
    </nav>

    <nav class="breadcrumbs" aria-label="Хлібні крихти">
        <a href="/">Головна</a>
        <span>/</span>
        <span>Профіль</span>
    </nav>

    <h1>Профіль</h1>

    <section id="auth-section" class="auth-section" style="visibility: hidden; min-height: 40px;">
        <div class="auth-controls">
            <input type="text" id="nickname" placeholder="Нікнейм (для реєстрації)" style="display:none;">
            <input type="email" id="email" placeholder="Email" style="display:none;">
            <input type="password" id="password" placeholder="Пароль" style="display:none;">
            <button id="btn-login" type="button" style="display:none;">Увійти</button>
            <button id="btn-register" type="button" style="display:none;">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Завантаження...</p>
    </section>

    <main id="profile-content" class="hidden">
        <p id="profile-email"></p>

        <section>
            <h2>Вибрані книги</h2>
            <p id="favorites-status">Завантаження...</p>
            <div id="favorite-books" class="profile-favorites"></div>
        </section>

        <section>
            <h2>Історія чату</h2>
            <p id="threads-status">Завантаження...</p>
            <div id="profile-thread-list" class="chat-thread-list"></div>
        </section>

        <section>
            <h2>Мої відгуки</h2>
            <p id="reviews-status">Завантаження...</p>
            <div id="profile-reviews-list" class="comments-list"></div>
        </section>
    </main>

    <p id="profile-login-note">Увійдіть, щоб переглянути профіль.</p>

    <footer class="site-footer">
        <p>ЧитAI — курсова робота студентів групи ММТЕ-11.</p>
    </footer>

    <script type="module" src="/js/firebase-config.js?v=8"></script>
    <script type="module" src="/js/profile.js?v=8"></script>
</body>
</html>
