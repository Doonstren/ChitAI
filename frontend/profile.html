<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — профіль</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <a href="/">Каталог</a>
        <a href="/chat">Нейробібліотекар</a>
        <a href="/profile">Профіль</a>
    </nav>

    <h1>Профіль</h1>

    <section id="auth-section" class="auth-section">
        <div class="auth-controls">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button id="btn-login" type="button">Увійти</button>
            <button id="btn-register" type="button">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Не авторизовано</p>
    </section>

    <main id="profile-content" class="hidden">
        <p id="profile-email"></p>

        <section>
            <h2>Вибрані книги</h2>
            <p id="favorites-status">Завантаження...</p>
            <div id="favorite-books" class="profile-favorites"></div>
        </section>

        <section>
            <h2>Історія чату</h2>
            <p id="threads-status">Завантаження...</p>
            <div id="profile-thread-list" class="chat-thread-list"></div>
        </section>
    </main>

    <p id="profile-login-note">Увійдіть, щоб переглянути профіль.</p>

    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/profile.js"></script>
</body>
</html>
