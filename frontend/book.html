<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧитAI — книга</title>
    <link rel="stylesheet" href="/css/main.css?v=6">
</head>
<body>
    <nav>
        <a href="/">Каталог</a>
        <a href="/chat">Нейробібліотекар</a>
        <a href="/profile">Профіль</a>
    </nav>

    <section id="auth-section" class="auth-section" style="visibility: hidden; min-height: 40px;">
        <div class="auth-controls">
            <input type="text" id="nickname" placeholder="Нікнейм (для реєстрації)" style="display:none;">
            <input type="email" id="email" placeholder="Email" style="display:none;">
            <input type="password" id="password" placeholder="Пароль" style="display:none;">
            <button id="btn-login" type="button" style="display:none;">Увійти</button>
            <button id="btn-register" type="button" style="display:none;">Зареєструватися</button>
            <button id="btn-logout" type="button" style="display:none;">Вийти</button>
        </div>
        <p id="auth-status">Завантаження...</p>
    </section>

    <main class="book-page">
        <p id="book-status">Завантаження книги...</p>
        <section id="book-detail" class="book-detail"></section>

        <section id="reader-section" class="hidden">
            <h2>Текст книги</h2>
            <p id="reader-status"></p>
            <div id="reader-content" class="reader-content"></div>
        </section>

        <section id="comments-section">
            <h2>Коментарі та оцінки</h2>
            <p id="comments-status">Завантаження коментарів...</p>
            <div id="comments-list" class="comments-list"></div>

            <form id="comment-form" class="hidden">
                <h3>Залишити коментар</h3>
                <label>
                    Оцінка
                    <select id="comment-rating">
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </label>
                <textarea id="comment-text" placeholder="Ваш коментар"></textarea>
                <button type="submit" class="primary-button">Надіслати</button>
            </form>
            <p id="comment-login-note">Увійдіть, щоб залишити коментар і оцінку.</p>
        </section>
    </main>

    <script type="module" src="/js/firebase-config.js?v=6"></script>
    <script type="module" src="/js/book.js?v=6"></script>
</body>
</html>
